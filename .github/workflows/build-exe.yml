name: Build EXE

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package as a GitHub Release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = python -c 'from heictojpg.version import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Version could not be read.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
              throw 'Tag does not match the package version.'
          }
          if ($env:GITHUB_REF_NAME.StartsWith('release/') -and $env:GITHUB_REF_NAME -ne "release/$tag") {
              throw 'Release branch does not match the package version.'
          }
          if (-not (Test-Path "RELEASE_NOTES_$tag.md")) { throw 'Release notes are missing.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q -ra
      - name: Build EXE package with licenses
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - name: Verify exact build environment and unpacked distribution
        shell: pwsh
        run: |
          $python = '.\.venv\Scripts\python.exe'
          & $python -m pip install pywinauto
          if ($LASTEXITCODE -ne 0) { throw 'GUI test dependency install failed.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency check failed.' }
          New-Item -ItemType Directory -Force release-verification | Out-Null
          & $python -m pytest -q -ra --junitxml release-verification/windows-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Build environment tests failed.' }
          & $python -m pip freeze | Set-Content release-verification/build-dependencies.txt
          Expand-Archive dist/HEICConverter.zip -DestinationPath "$env:RUNNER_TEMP/heic-unpacked"
          $exe = "$env:RUNNER_TEMP/heic-unpacked/HEICConverter/HEICConverter.exe"
          & $python scripts/verify_release.py --exe $exe --report-dir release-verification/ntfs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged EXE/GUI verification failed.' }
      - name: Verify real exFAT filesystem in a disposable VHD
        shell: pwsh
        run: |
          .\scripts\verify_exfat.ps1 -Python '.\.venv\Scripts\python.exe' `
            -Exe "$env:RUNNER_TEMP/heic-unpacked/HEICConverter/HEICConverter.exe" `
            -ReportDir release-verification/exfat
      - name: Write checksums and build manifest
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash dist/HEICConverter.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  HEICConverter.zip" | Set-Content dist/HEICConverter.zip.sha256 -Encoding ascii
          $manifest = @{
              version = '${{ steps.version.outputs.tag }}'
              commit = $env:GITHUB_SHA
              run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              zip_sha256 = $zipHash
              verification = @('pytest', 'packaged-exe-gui', 'cancel-restart', 'exfat-vhd')
              physical_usb_tested = $false
          }
          $manifest | ConvertTo-Json | Set-Content dist/build-manifest.json -Encoding utf8
          Compress-Archive release-verification/* -DestinationPath dist/release-verification.zip
      - name: Upload verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ github.run_attempt }}
          path: release-verification/
          if-no-files-found: warn
      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: HEICConverter-release
          path: |
            dist/HEICConverter.zip
            dist/HEICConverter.zip.sha256
            dist/build-manifest.json
            dist/release-verification.zip
          if-no-files-found: error

  publish:
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build-exe.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: HEICConverter-release
          path: release-files
      - name: Publish only after validating uploaded ZIP bytes
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true || {
              echo 'Refusing to replace an already published release.'; exit 1;
            }
            test "$(jq -r .targetCommitish existing-release.json)" = "$GITHUB_SHA" || {
              echo 'Existing draft points to a different commit.'; exit 1;
            }
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --draft \
              --target "$GITHUB_SHA" --title "HEIC Converter $RELEASE_TAG" \
              --notes-file "RELEASE_NOTES_$RELEASE_TAG.md"
          fi
          mkdir verified-download
          gh release download "$RELEASE_TAG" --pattern HEICConverter.zip --dir verified-download
          cp release-files/HEICConverter.zip.sha256 verified-download/
          (cd verified-download && sha256sum --check HEICConverter.zip.sha256)
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,assets
