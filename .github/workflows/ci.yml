name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.10'
            dependencies: current
          - os: windows-latest
            python-version: '3.12'
            dependencies: current
          - os: windows-latest
            python-version: '3.10'
            dependencies: minimum-codecs
          - os: ubuntu-latest
            python-version: '3.12'
            dependencies: current
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install minimum supported codecs
        if: matrix.dependencies == 'minimum-codecs'
        run: python -m pip install 'Pillow==10.4.0' 'pillow-heif==0.18.0'
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -ra
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -ra
